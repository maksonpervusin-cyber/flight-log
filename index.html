<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Log 2.0</title>
<style>
* { box-sizing: border-box; }
body {
  background: #101722;
  color: white;
  font-family: -apple-system, Arial, sans-serif;
  padding: 16px;
  max-width: 650px;
  margin: auto;
}
h1 { color: #60a5fa; margin-bottom: 5px; }
small { color: #94a3b8; }
.stats {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
.card, .record, form {
  background: #1d2939;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}
.card { flex: 1; }
.card h2 {
  color: #60a5fa;
  margin-bottom: 0;
}
input, select, textarea, button {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
input, select, textarea {
  background: #304056;
  color: white;
}
input::placeholder, textarea::placeholder {
  color: #b0bdce;
}
button {
  background: #2563eb;
  color: white;
  font-weight: bold;
}
label {
  display: block;
  margin-top: 10px;
  color: #b8c7da;
  font-size: 14px;
}
.delete { background: #b91c1c; }
.secondary { background: #475569; }
.export { background: #047857; }
.row {
  display: flex;
  gap: 8px;
}
.row > * { flex: 1; min-width: 0; }
.details {
  white-space: pre-wrap;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h1>FLIGHT LOG 2.0</h1>
<small>Журнал гражданских полётов</small>

<div class="stats">
  <div class="card">
    Полёты
    <h2 id="total">0</h2>
  </div>
  <div class="card">
    Налёт, мин
    <h2 id="minutes">0</h2>
  </div>
</div>

<form id="form">

  <label>Дата</label>
  <input id="date" type="date" required>

  <label>Длительность полёта</label>
  <input id="duration" type="number"
    min="1" placeholder="Минуты" required>

  <label>Тип аккумулятора</label>
  <select id="batteryType">
    <option>LiPo</option>
    <option>LiHV</option>
    <option>Li-ion</option>
    <option>Другой</option>
  </select>

  <label>Ёмкость аккумулятора, мА·ч</label>
  <input id="capacity" type="number"
    min="1" list="capacities"
    placeholder="Выбрать или ввести">

  <datalist id="capacities">
    <option value="1500">
    <option value="2200">
    <option value="3000">
    <option value="5000">
    <option value="6000">
    <option value="7500">
    <option value="10000">
    <option value="10500">
    <option value="12000">
    <option value="16000">
    <option value="22000">
  </datalist>

  <label>Маркировка аккумулятора</label>
  <input id="battery"
    placeholder="Название или номер АКБ">

  <label>Расход запчастей</label>

  <div class="row">
    <select id="part">
      <option>Отсутствует</option>
      <option>Пропеллер</option>
      <option>Камера</option>
      <option>Корпус</option>
      <option>Крепление</option>
      <option>Кабель</option>
      <option>Разъём</option>
      <option>Другая деталь</option>
    </select>

    <input id="quantity" type="number"
      min="1" value="1">
  </div>

  <button type="button" class="secondary"
    id="addPart">+ Добавить деталь</button>

  <div id="partsList"></div>

  <label>Заметки</label>
  <textarea id="notes"
    placeholder="Комментарий"></textarea>

  <button id="save" type="submit">
    + Добавить запись
  </button>

  <button id="cancel" type="button"
    class="secondary" hidden>
    Отменить редактирование
  </button>

</form>

<button class="export" id="export">
  Экспорт в CSV
</button>

<h2>История полётов</h2>
<div id="history"></div>

<script>
const el = id => document.getElementById(id);

let records = [];

try {
  records = JSON.parse(
    localStorage.getItem('flightLog') || '[]'
  );
  if (!Array.isArray(records)) records = [];
} catch {
  records = [];
}

let editing = -1;
let parts = [];

function saveData() {
  try {
    localStorage.setItem(
      'flightLog', JSON.stringify(records)
    );
  } catch {
    alert('Не удалось сохранить данные.');
  }
}

function setDate() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  el('date').value = d.toISOString().slice(0, 10);
}

function renderParts() {
  el('partsList').replaceChildren();

  parts.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'row';

    const text = document.createElement('p');
    text.textContent = p.name + ' × ' + p.qty;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'delete';
    btn.textContent = 'Убрать';
    btn.onclick = () => {
      parts.splice(i, 1);
      renderParts();
    };

    row.append(text, btn);
    el('partsList').appendChild(row);
  });
}

el('addPart').onclick = () => {
  const name = el('part').value;
  const qty = Number(el('quantity').value);

  if (name === 'Отсутствует') {
    parts = [];
  } else {
    if (!Number.isInteger(qty) || qty < 1) {
      alert('Укажи количество деталей');
      return;
    }

    const existing = parts.find(p => p.name === name);

    if (existing) {
      existing.qty += qty;
    } else {
      parts.push({name, qty});
    }
  }

  renderParts();
};

function resetForm() {
  editing = -1;
  parts = [];
  el('form').reset();
  el('save').textContent = '+ Добавить запись';
  el('cancel').hidden = true;
  setDate();
  renderParts();
}

function editRecord(i) {
  const r = records[i];

  editing = i;

  el('date').value = r.date;
  el('duration').value = r.duration;
  el('batteryType').value = r.batteryType || 'LiPo';
  el('capacity').value = r.capacity || '';
  el('battery').value = r.battery || '';
  el('notes').value = r.notes || '';

  parts = (r.parts || []).map(p => ({...p}));

  el('save').textContent = 'Сохранить изменения';
  el('cancel').hidden = false;

  renderParts();

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

el('cancel').onclick = resetForm;

function deleteRecord(i) {
  if (!confirm('Удалить эту запись?')) return;

  records.splice(i, 1);
  resetForm();
  saveData();
  render();
}

function partText(r) {
  return r.parts && r.parts.length
    ? r.parts.map(
        p => p.name + ' × ' + p.qty
      ).join(', ')
    : 'Отсутствует';
}

function render() {
  el('total').textContent = records.length;

  el('minutes').textContent = records.reduce(
    (sum, r) => sum + Number(r.duration || 0), 0
  );

  el('history').replaceChildren();

  for (let i = records.length - 1; i >= 0; i--) {
    const r = records[i];

    const card = document.createElement('div');
    card.className = 'record';

    const details = document.createElement('div');
    details.className = 'details';

    details.textContent =
      'Дата: ' + r.date + '\n' +
      'Налёт: ' + r.duration + ' мин\n' +
      'АКБ: ' + (r.batteryType || '') +
      ' ' + (r.battery || '') + '\n' +
      'Ёмкость: ' +
      (r.capacity ? r.capacity + ' мА·ч' : 'Не указана') +
      '\nРасход: ' + partText(r) +
      '\nЗаметки: ' + (r.notes || 'Нет');

    const row = document.createElement('div');
    row.className = 'row';

    const edit = document.createElement('button');
    edit.textContent = 'Редактировать';
    edit.onclick = () => editRecord(i);

    const del = document.createElement('button');
    del.className = 'delete';
    del.textContent = 'Удалить';
    del.onclick = () => deleteRecord(i);

    row.append(edit, del);
    card.append(details, row);

    el('history').appendChild(card);
  }
}

el('form').onsubmit = e => {
  e.preventDefault();

  const record = {
    date: el('date').value,
    duration: Number(el('duration').value),
    batteryType: el('batteryType').value,
    capacity: el('capacity').value,
    battery: el('battery').value,
    parts: parts.map(p => ({...p})),
    notes: el('notes').value
  };

  if (editing >= 0) {
    records[editing] = record;
  } else {
    records.push(record);
  }

  saveData();
  resetForm();
  render();
};

el('export').onclick = () => {
  const rows = [
    ['Дата', 'Налёт', 'Тип АКБ',
     'Ёмкость', 'Маркировка',
     'Запчасти', 'Заметки']
  ];

  records.forEach(r => {
    rows.push([
      r.date,
      r.duration,
      r.batteryType || '',
      r.capacity || '',
      r.battery || '',
      partText(r),
      r.notes || ''
    ]);
  });

  const csv = rows.map(row =>
    row.map(value => {
      let s = String(value);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }).join(';')
  ).join('\r\n');

  const blob = new Blob(
    ['\uFEFF' + csv],
    {type: 'text/csv;charset=utf-8;'}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'FlightLog.csv';

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 10000);
};

setDate();
render();
</script>

</body>
</html>
